external-dns:
  policy: sync
  provider:
    name: godaddy
  env:
  - name: EXTERNAL_DNS_GODADDY_API_KEY
    valueFrom:
      secretKeyRef:
        name: godaddy-api-key
        key: godaddy-api-key
  - name: EXTERNAL_DNS_GODADDY_API_SECRET
    valueFrom:
      secretKeyRef:
        name: godaddy-api-secret
        key: godaddy-api-secret
